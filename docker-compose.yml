version: "3.9"

services:
  api-fahmyzzx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-fahmyzzx
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: "0.0.0.0"
      PORT: "9876"
      PROVIDER_API_KEY: "${PROVIDER_API_KEY}"
      MODEL_ID: "${MODEL_ID:-google-ai-mode}"
      GAI_WORKER_HOST: "127.0.0.1"
      GAI_WORKER_PORT: "9879"
      GAI_USE_PERSISTENT_WORKER: "true"
      NODE_BIN: "node"
      CHROME_BIN: "/usr/bin/chromium"
      COOKIES_PATH: "/app/data/cookies.json"
    volumes:
      - api_fahmyzzx_data:/app/data
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN

volumes:
  api_fahmyzzx_data:
